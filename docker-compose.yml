services:
  backend:
    build:
      context: ./backend
    container_name: contigo-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: contigo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      API_URL: http://localhost:3001
    restart: unless-stopped
